<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Judgment Lab</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<h1>Judgment Lab</h1>
<p>Teach AI how to evaluate things the way you would.</p>

<div class="card">
    <label>Model Provider: </label>
    <select id="provider">
        <option value="">Select...</option>
        <option value="openai">ChatGPT</option>
        <option value="anthropic">Claude</option>
    </select>

    <div style="padding-top:16px">
        <label>
            API Key:
        </label>
        <input
            type="password"
            id="apiKey"
            placeholder="Please paste your API key here"
        />
    </div>
</div>

<div class="card">
    <div class="stats">
        <!-- TODO: replace 0 with actual run count + cost, based on state var  -->
        <span>Runs: <span id="runCount">0</span> / 20</span>
        <span>Estimated Cost: $<span id="cost">0.00</span></span>
    </div>
</div>

<div class="card">
    <h3>How should AI evaluate these examples?</h3>
    <!-- TODO: pass in state var here too for actual user entered text-->
    <textarea id="prompt" placeholder="Review creator applications for authenticity, audience fit, and likelihood of successful partnership. Return a score out of 10 and a brief explanation.">
    </textarea>
</div>

<div class="card">
    <h3>Test Examples</h3>

    <div id="examplesContainer"></div>

    <button id="addExampleBtn">
        + Add Example
    </button>
</div>

<div style="margin-bottom: 24px;">
    <button id="runBtn">
        Run
    </button>
</div>

<div class="card">
    <h3>Results</h3>

    <div id="results"></div>
</div>

</body>

</html>
